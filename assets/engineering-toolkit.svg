<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 470" width="850" height="470">
<defs>
  <linearGradient id="tkBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#040506"/>
    <stop offset="50%" stop-color="#081312"/>
    <stop offset="100%" stop-color="#0A1E17"/>
  </linearGradient>
  <pattern id="tkGrid" width="25" height="25" patternUnits="userSpaceOnUse">
    <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#00FF88" stroke-width="0.5" stroke-opacity="0.04"/>
  </pattern>
  <filter id="tkGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  @keyframes tkBreathe{0%,100%{stroke-opacity:0.25}50%{stroke-opacity:0.65}}
  @keyframes tkBlink{0%,100%{opacity:1}50%{opacity:0.3}}
  @keyframes tkRing{0%{r:4px;opacity:0.8}100%{r:10px;opacity:0}}
  @keyframes tkFlow{0%{stroke-dashoffset:80}100%{stroke-dashoffset:0}}
  .tkBorder{fill:none;stroke:#00FF88;stroke-width:1.5;animation:tkBreathe 4s ease-in-out infinite}
  .tkCorner{fill:none;stroke:#00FF88;stroke-opacity:0.8;filter:url(#tkGlow)}
  .tkDot{animation:tkBlink 2.5s infinite ease-in-out}
  .tkRingAnim{animation:tkRing 2.5s infinite cubic-bezier(0.215,0.61,0.355,1)}
  .tkTrace{stroke:#00FF88;stroke-opacity:0.15;stroke-dasharray:8 12;animation:tkFlow 6s linear infinite;fill:none;stroke-width:1}
  .tkTag{fill:#0D2016;fill-opacity:0.85;stroke:#00FF88;stroke-opacity:0.3;stroke-width:1;rx:4}
  .tkTagTxt{font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;fill:#E9FFD7}
  .tkCat{font-family:'SFMono-Regular',Consolas,monospace;font-size:10px;font-weight:bold;fill:#00FF88}
  .tkMute{font-family:'SFMono-Regular',Consolas,monospace;fill:#3A5E48}
  .tkHead{font-family:'SFMono-Regular',Consolas,monospace;font-size:22px;font-weight:bold;fill:#E9FFD7}
  .tkStatus{font-family:'SFMono-Regular',Consolas,monospace;font-size:10px;font-weight:bold;fill:#7CFF5E}
</style>

<!-- Background -->
<rect width="850" height="470" fill="url(#tkBg)" rx="10"/>
<rect width="850" height="470" fill="url(#tkGrid)" rx="10"/>

<!-- PCB Background Traces -->
<g fill="none" stroke-opacity="0.12" stroke-width="1">
  <path d="M 15 75 L 15 25 L 75 25" stroke="#00FF88"/>
  <circle cx="75" cy="25" r="2" fill="#00FF88" fill-opacity="0.3" stroke="none"/>
  <path d="M 820 15 L 750 15 L 730 35 L 680 35" stroke="#00FF88" class="tkTrace"/>
  <circle cx="680" cy="35" r="1.5" fill="#00FF88" fill-opacity="0.25" stroke="none"/>
  <path d="M 835 395 L 835 445 L 775 445" stroke="#00FF88"/>
  <circle cx="775" cy="445" r="2" fill="#00FF88" fill-opacity="0.3" stroke="none"/>
  <path d="M 30 460 L 110 460 L 130 440 L 190 440" stroke="#00FF88" class="tkTrace"/>
  <circle cx="190" cy="440" r="1.5" fill="#00FF88" fill-opacity="0.25" stroke="none"/>
</g>

<!-- Outer Border (Chamfered) -->
<path d="M 20 8 L 830 8 L 842 20 L 842 450 L 830 462 L 20 462 L 8 450 L 8 20 Z" class="tkBorder"/>

<!-- Corner Accents -->
<path d="M 8 45 L 8 20 L 20 8 L 45 8" class="tkCorner" stroke-width="2"/>
<path d="M 842 45 L 842 20 L 830 8 L 805 8" class="tkCorner" stroke-width="2"/>
<path d="M 8 425 L 8 450 L 20 462 L 45 462" class="tkCorner" stroke-width="2"/>
