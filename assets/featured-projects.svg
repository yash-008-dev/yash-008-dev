  <rect x="237" y="78" width="58" height="18" class="fpTag"/>
  <text x="266" y="90" class="fpTagTxt" text-anchor="middle">WebRTC</text>

  <rect x="15" y="110" width="82" height="22" class="fpBtn"/>
  <text x="56" y="125" class="fpBtnTxt" text-anchor="middle">↗ SOURCE</text>
</g>

