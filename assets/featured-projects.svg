  <circle cx="18" cy="20" r="3.5" fill="#7CFF5E" class="fpDot"/>
  <text x="28" y="23" class="fpStatusTxt">● ACTIVE</text>
  <text x="15" y="48" class="fpName">VoiceShield AI</text>
  <text x="15" y="65" class="fpDesc">Real-time audio intelligence for proactive scam detection</text>

  <rect x="15" y="78" width="82" height="18" class="fpTag"/>
  <text x="56" y="90" class="fpTagTxt" text-anchor="middle">TypeScript</text>
  <rect x="105" y="78" width="52" height="18" class="fpTag"/>
  <text x="131" y="90" class="fpTagTxt" text-anchor="middle">React</text>
  <rect x="165" y="78" width="64" height="18" class="fpTag"/>
