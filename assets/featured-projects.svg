  <path d="M 0 20 L 0 0 L 20 0" class="fpCardCorner"/>
  <path d="M 370 0 L 390 0 L 390 20" class="fpCardCorner"/>
  <path d="M 0 135 L 0 155 L 20 155" class="fpCardCorner"/>
