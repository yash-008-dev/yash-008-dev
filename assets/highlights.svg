  <path d="M 0 85 L 0 100 L 15 100" class="hlCardCorner"/>
  <path d="M 240 100 L 255 100 L 255 85" class="hlCardCorner"/>
  <text x="15" y="32" class="hlMetric">OS CONTRIBUTOR</text>
  <text x="15" y="52" class="hlTitle">Merged Pull Requests</text>
  <text x="15" y="72" class="hlSub">Production repository contributions</text>
</g>

<!-- ═══ ROW 2 ═══ -->
<!-- Card 4: AI & Security Builder -->
<g transform="translate(25, 205)">
  <rect width="255" height="100" class="hlCard"/>
  <path d="M 0 15 L 0 0 L 15 0" class="hlCardCorner"/>
  <path d="M 240 0 L 255 0 L 255 15" class="hlCardCorner"/>
  <path d="M 0 85 L 0 100 L 15 100" class="hlCardCorner"/>
  <path d="M 240 100 L 255 100 L 255 85" class="hlCardCorner"/>
  <text x="15" y="32" class="hlMetric">AI BUILDER</text>
  <text x="15" y="52" class="hlTitle">AI &amp; Security Projects</text>
  <text x="15" y="72" class="hlSub">Multi-project AI security portfolio</text>
</g>

<!-- Card 5: 431+ GitHub Contributions -->
<g transform="translate(298, 205)">
  <rect width="255" height="100" class="hlCard"/>
  <path d="M 0 15 L 0 0 L 15 0" class="hlCardCorner"/>
  <path d="M 240 0 L 255 0 L 255 15" class="hlCardCorner"/>
  <path d="M 0 85 L 0 100 L 15 100" class="hlCardCorner"/>
  <path d="M 240 100 L 255 100 L 255 85" class="hlCardCorner"/>
  <text x="15" y="32" class="hlMetric">431+</text>
  <text x="15" y="52" class="hlTitle">GitHub Contributions</text>
  <text x="15" y="72" class="hlSub">Year-round consistent activity streak</text>
</g>

<!-- Card 6: 500+ DSA Problems -->
<g transform="translate(570, 205)">
  <rect width="255" height="100" class="hlCard"/>
  <path d="M 0 15 L 0 0 L 15 0" class="hlCardCorner"/>
  <path d="M 240 0 L 255 0 L 255 15" class="hlCardCorner"/>
  <path d="M 0 85 L 0 100 L 15 100" class="hlCardCorner"/>
  <path d="M 240 100 L 255 100 L 255 85" class="hlCardCorner"/>
  <text x="15" y="32" class="hlMetric">500+</text>
  <text x="15" y="52" class="hlTitle">DSA Problems Solved</text>
  <text x="15" y="72" class="hlSub">Competitive programming mastery</text>
</g>

<!-- Footer -->
<text x="815" y="318" class="hlMute" font-size="7" text-anchor="end">ACHIEVEMENT_LOG: VERIFIED // INTEGRITY: SHA256_VALID</text>
</svg>
