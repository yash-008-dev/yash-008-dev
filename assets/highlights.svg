  <path d="M 0 85 L 0 100 L 15 100" class="hlCardCorner"/>
  <path d="M 240 100 L 255 100 L 255 85" class="hlCardCorner"/>
  <text x="15" y="32" class="hlMetric">FINALIST</text>
  <text x="15" y="52" class="hlTitle">HackOrbit National Hackathon</text>
