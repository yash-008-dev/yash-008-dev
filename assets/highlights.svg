<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="850" height="330">
<defs>
  <linearGradient id="hlBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#040506"/>
    <stop offset="50%" stop-color="#081312"/>
    <stop offset="100%" stop-color="#0A1E17"/>
  </linearGradient>
  <pattern id="hlGrid" width="25" height="25" patternUnits="userSpaceOnUse">
    <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#00FF88" stroke-width="0.5" stroke-opacity="0.04"/>
  </pattern>
  <filter id="hlGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  @keyframes hlBreathe{0%,100%{stroke-opacity:0.25}50%{stroke-opacity:0.65}}
  @keyframes hlBlink{0%,100%{opacity:1}50%{opacity:0.3}}
  @keyframes hlRing{0%{r:4px;opacity:0.8}100%{r:10px;opacity:0}}
  .hlBorder{fill:none;stroke:#00FF88;stroke-width:1.5;animation:hlBreathe 4s ease-in-out infinite}
  .hlCorner{fill:none;stroke:#00FF88;stroke-opacity:0.8;filter:url(#hlGlow)}
  .hlDot{animation:hlBlink 2.5s infinite ease-in-out}
  .hlRingA{animation:hlRing 2.5s infinite cubic-bezier(0.215,0.61,0.355,1)}
  .hlCard{fill:#0A1510;fill-opacity:0.9;stroke:#00FF88;stroke-opacity:0.15;stroke-width:1;rx:6}
  .hlCardCorner{fill:none;stroke:#00FF88;stroke-width:1.5}
  .hlMetric{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px;font-weight:bold;fill:#7CFF5E}
  .hlTitle{font-family:'SFMono-Regular',Consolas,monospace;font-size:10px;font-weight:bold;fill:#E9FFD7}
  .hlSub{font-family:'SFMono-Regular',Consolas,monospace;font-size:9px;fill:#4A6A55}
  .hlHead{font-family:'SFMono-Regular',Consolas,monospace;font-size:22px;font-weight:bold;fill:#E9FFD7}
  .hlStatus{font-family:'SFMono-Regular',Consolas,monospace;font-size:10px;font-weight:bold;fill:#7CFF5E}
  .hlMute{font-family:'SFMono-Regular',Consolas,monospace;fill:#3A5E48}
</style>

<!-- Background -->
<rect width="850" height="330" fill="url(#hlBg)" rx="10"/>
<rect width="850" height="330" fill="url(#hlGrid)" rx="10"/>

<!-- PCB Traces -->
<g fill="none" stroke-opacity="0.12" stroke-width="1">
  <path d="M 15 65 L 15 20 L 65 20" stroke="#00FF88"/>
  <circle cx="65" cy="20" r="2" fill="#00FF88" fill-opacity="0.3" stroke="none"/>
  <path d="M 835 265 L 835 310 L 785 310" stroke="#00FF88"/>
  <circle cx="785" cy="310" r="2" fill="#00FF88" fill-opacity="0.3" stroke="none"/>
</g>

<!-- Outer Border -->
<path d="M 20 8 L 830 8 L 842 20 L 842 310 L 830 322 L 20 322 L 8 310 L 8 20 Z" class="hlBorder"/>
<path d="M 8 45 L 8 20 L 20 8 L 45 8" class="hlCorner" stroke-width="2"/>
<path d="M 842 45 L 842 20 L 830 8 L 805 8" class="hlCorner" stroke-width="2"/>
<path d="M 8 285 L 8 310 L 20 322 L 45 322" class="hlCorner" stroke-width="2"/>
<path d="M 842 285 L 842 310 L 830 322 L 805 322" class="hlCorner" stroke-width="2"/>

<!-- Header -->
<circle cx="35" cy="35" r="4" fill="#7CFF5E" class="hlDot"/>
<circle cx="35" cy="35" r="4" stroke="#7CFF5E" stroke-width="1.5" fill="none" class="hlRingA"/>
<text x="50" y="39" class="hlStatus">SYS.ACHIEVEMENTS // VERIFIED</text>
<text x="30" y="64" class="hlHead">HIGHLIGHTS</text>
<text x="815" y="64" class="hlMute" font-size="9" text-anchor="end">VERIFIED_ENTRIES: 6</text>
<line x1="10" y1="74" x2="840" y2="74" stroke="#00FF88" stroke-opacity="0.2"/>

<!-- ═══ ROW 1 ═══ -->
<!-- Card 1: Top 100 Team -->
<g transform="translate(25, 85)">
  <rect width="255" height="100" class="hlCard"/>
  <path d="M 0 15 L 0 0 L 15 0" class="hlCardCorner"/>
  <path d="M 240 0 L 255 0 L 255 15" class="hlCardCorner"/>
  <path d="M 0 85 L 0 100 L 15 100" class="hlCardCorner"/>
  <path d="M 240 100 L 255 100 L 255 85" class="hlCardCorner"/>
  <text x="15" y="32" class="hlMetric">TOP 100</text>
  <text x="15" y="52" class="hlTitle">Canara Bank Innovation Challenge</text>
  <text x="15" y="72" class="hlSub">Ranked among 756+ competing teams</text>
  <text x="15" y="88" class="hlSub">nationwide</text>
</g>

<!-- Card 2: HackOrbit Finalist -->
