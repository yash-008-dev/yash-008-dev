<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 150" width="850" height="150">
<defs>
  <linearGradient id="cnBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#040506"/>
    <stop offset="50%" stop-color="#081312"/>
    <stop offset="100%" stop-color="#0A1E17"/>
  </linearGradient>
  <pattern id="cnGrid" width="25" height="25" patternUnits="userSpaceOnUse">
    <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#00FF88" stroke-width="0.5" stroke-opacity="0.04"/>
  </pattern>
  <filter id="cnGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  @keyframes cnBreathe{0%,100%{stroke-opacity:0.25}50%{stroke-opacity:0.65}}
  @keyframes cnBlink{0%,100%{opacity:1}50%{opacity:0.3}}
  @keyframes cnRing{0%{r:4px;opacity:0.8}100%{r:10px;opacity:0}}
  .cnBorder{fill:none;stroke:#00FF88;stroke-width:1.5;animation:cnBreathe 4s ease-in-out infinite}
  .cnCorner{fill:none;stroke:#00FF88;stroke-opacity:0.8;filter:url(#cnGlow)}
  .cnDot{animation:cnBlink 2.5s infinite ease-in-out}
  .cnRingA{animation:cnRing 2.5s infinite cubic-bezier(0.215,0.61,0.355,1)}
  .cnBtn{fill:#0A1510;fill-opacity:0.9;stroke:#00FF88;stroke-opacity:0.35;stroke-width:1.2;rx:5}
  .cnBtnTxt{font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;font-weight:bold;fill:#E9FFD7}
  .cnBtnSub{font-family:'SFMono-Regular',Consolas,monospace;font-size:7px;fill:#4A6A55}
  .cnHead{font-family:'SFMono-Regular',Consolas,monospace;font-size:18px;font-weight:bold;fill:#E9FFD7}
  .cnStatus{font-family:'SFMono-Regular',Consolas,monospace;font-size:10px;font-weight:bold;fill:#7CFF5E}
  .cnMute{font-family:'SFMono-Regular',Consolas,monospace;fill:#3A5E48}
  .cnSoon{fill:#0D2016;fill-opacity:0.9;stroke:#7CFF5E;stroke-opacity:0.4;stroke-width:0.8;rx:3}
  .cnSoonTxt{font-family:'SFMono-Regular',Consolas,monospace;font-size:7px;fill:#7CFF5E}
</style>

<!-- Background -->
<rect width="850" height="150" fill="url(#cnBg)" rx="10"/>
<rect width="850" height="150" fill="url(#cnGrid)" rx="10"/>

<!-- Outer Border -->
<path d="M 20 8 L 830 8 L 842 20 L 842 130 L 830 142 L 20 142 L 8 130 L 8 20 Z" class="cnBorder"/>
<path d="M 8 35 L 8 20 L 20 8 L 35 8" class="cnCorner" stroke-width="2"/>
<path d="M 842 35 L 842 20 L 830 8 L 815 8" class="cnCorner" stroke-width="2"/>
<path d="M 8 115 L 8 130 L 20 142 L 35 142" class="cnCorner" stroke-width="2"/>
<path d="M 842 115 L 842 130 L 830 142 L 815 142" class="cnCorner" stroke-width="2"/>

<!-- Header -->
<circle cx="30" cy="30" r="3.5" fill="#7CFF5E" class="cnDot"/>
<circle cx="30" cy="30" r="3.5" stroke="#7CFF5E" stroke-width="1" fill="none" class="cnRingA"/>
<text x="42" y="34" class="cnStatus">NET.LINKS // OPEN</text>
<text x="200" y="34" class="cnHead">LET'S CONNECT</text>
<line x1="10" y1="48" x2="840" y2="48" stroke="#00FF88" stroke-opacity="0.15"/>

<!-- 6 Buttons -->
<!-- Button 1: LinkedIn -->
<g transform="translate(28, 58)">
  <rect width="122" height="42" class="cnBtn"/>
  <text x="61" y="22" class="cnBtnTxt" text-anchor="middle">LinkedIn</text>
  <text x="61" y="35" class="cnBtnSub" text-anchor="middle">↗ professional</text>
</g>

<!-- Button 2: GitHub -->
<g transform="translate(163, 58)">
  <rect width="122" height="42" class="cnBtn"/>
  <text x="61" y="22" class="cnBtnTxt" text-anchor="middle">GitHub</text>
  <text x="61" y="35" class="cnBtnSub" text-anchor="middle">↗ repositories</text>
</g>

<!-- Button 3: LeetCode -->
<g transform="translate(298, 58)">
  <rect width="122" height="42" class="cnBtn"/>
  <text x="61" y="22" class="cnBtnTxt" text-anchor="middle">LeetCode</text>
  <text x="61" y="35" class="cnBtnSub" text-anchor="middle">↗ problem solving</text>
</g>

<!-- Button 4: Codeforces -->
<g transform="translate(433, 58)">
  <rect width="122" height="42" class="cnBtn"/>
  <text x="61" y="22" class="cnBtnTxt" text-anchor="middle">Codeforces</text>
  <text x="61" y="35" class="cnBtnSub" text-anchor="middle">↗ competitive</text>
</g>

<!-- Button 5: Email -->
<g transform="translate(568, 58)">
  <rect width="122" height="42" class="cnBtn"/>
  <text x="61" y="22" class="cnBtnTxt" text-anchor="middle">Email</text>
  <text x="61" y="35" class="cnBtnSub" text-anchor="middle">↗ direct contact</text>
</g>

<!-- Button 6: Portfolio (Coming Soon) -->
<g transform="translate(703, 58)">
  <rect width="122" height="42" class="cnBtn" stroke-dasharray="4 3"/>
  <text x="61" y="22" class="cnBtnTxt" text-anchor="middle" fill-opacity="0.5">Portfolio</text>
  <rect x="30" y="28" width="62" height="14" class="cnSoon"/>
  <text x="61" y="38" class="cnSoonTxt" text-anchor="middle">COMING SOON</text>
</g>

<!-- Footer -->
<text x="815" y="138" class="cnMute" font-size="7" text-anchor="end">NETWORK_STATUS: ACCEPTING_CONNECTIONS</text>
</svg>
