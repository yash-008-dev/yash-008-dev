name: Update developer analytics

on:
  schedule:
    - cron: "30 17 * * *"      # 17:30 UTC = 23:00 IST, every day
  workflow_dispatch:           # adds a "Run workflow" button for manual testing

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build analytics.svg
        run: python scripts/stats.py
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics.svg .stats-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update analytics"
            git pull --rebase
            git push
          fi
