<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
.bg{fill:#060606;}
.title{font:700 42px 'JetBrains Mono',monospace;fill:#CAFF3C;}
.text{font:22px 'JetBrains Mono',monospace;fill:#d7ffd0;}
.dim{fill:#79f5ff;font:20px 'JetBrains Mono',monospace;}
.small{fill:#999;font:18px 'JetBrains Mono',monospace;}
.green{fill:#CAFF3C;}
.line{stroke:#CAFF3C;stroke-width:2;opacity:.7}
.grid{stroke:#1b1b1b;stroke-width:1}
.scan{fill:url(#scan);}
</style>

<linearGradient id="border" x1="0" x2="1">
<stop offset="0%" stop-color="#CAFF3C"/>
<stop offset="50%" stop-color="#00F0FF">
<animate attributeName="stop-color" values="#00F0FF;#BB00FF;#00F0FF" dur="6s" repeatCount="indefinite"/>
</stop>
<stop offset="100%" stop-color="#CAFF3C"/>
</linearGradient>

<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" class="grid"/>
</pattern>

<linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
<stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<mask id="typeMask">
<rect x="0" y="0" width="0" height="40" fill="white">
<animate attributeName="width" values="0;520;520" dur="5s" repeatCount="indefinite"/>
</rect>
</mask>
</defs>

<rect width="1600" height="500" class="bg"/>
<rect width="1600" height="500" fill="url(#g)"/>

<rect x="20" y="20" width="1560" height="460" rx="16" fill="none" stroke="url(#border)" stroke-width="3"/>

<line x1="40" y1="70" x2="1560" y2="70" class="line"/>
<circle cx="60" cy="45" r="7" fill="#00ff88">
<animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/>
</circle>

<text x="90" y="52" class="small">AI DEVELOPMENT CONSOLE</text>
<text x="1360" y="52" class="green">ONLINE</text>

<text x="70" y="130" class="small">&gt; whoami</text>

<text x="70" y="180" class="title">Adhyatma Singh Chauhan
<animate attributeName="opacity" values="1;.85;1;.6;1" dur="0.2s" begin="2s;5s;9s"/>
</text>

<text x="70" y="235" class="small">&gt; role</text>
<text x="70" y="270" class="dim">Software Engineer • AI Developer • Open Source</text>

<text x="70" y="325" class="small">&gt; currently</text>

<g mask="url(#typeMask)">
<text x="70" y="365" class="text">Building Intelligent Systems...</text>
</g>

<rect x="70" y="375" width="10" height="24" fill="#CAFF3C">
<animate attributeName="x" values="70;590;590" dur="5s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/>
</rect>

<text x="1050" y="130" class="small">SYSTEM STATUS</text>

<text x="1050" y="180" class="text">CPU</text>
<rect x="1130" y="164" width="280" height="18" fill="#111"/>
<rect x="1130" y="164" width="170" height="18" fill="#CAFF3C">
<animate attributeName="width" values="120;230;170;200;170" dur="4s" repeatCount="indefinite"/>
</rect>

<text x="1050" y="230" class="text">RAM</text>
<rect x="1130" y="214" width="280" height="18" fill="#111"/>
<rect x="1130" y="214" width="200" height="18" fill="#00F0FF">
<animate attributeName="width" values="180;240;190;220;180" dur="5s" repeatCount="indefinite"/>
</rect>

<text x="1050" y="280" class="text">NETWORK</text>
<rect x="1130" y="264" width="280" height="18" fill="#111"/>
<rect x="1130" y="264" width="250" height="18" fill="#BB00FF">
<animate attributeName="width" values="220;260;200;250" dur="3.5s" repeatCount="indefinite"/>
</rect>

<text x="1045" y="360" class="small">STACK</text>
<text x="1045" y="395" class="dim">Java • Spring • React • Node • AI • AWS</text>

<circle cx="1490" cy="420" r="40" fill="none" stroke="#00F0FF">
<animateTransform attributeName="transform" type="rotate" from="0 1490 420" to="360 1490 420" dur="8s" repeatCount="indefinite"/>
</circle>

<circle cx="1490" cy="420" r="8" fill="#CAFF3C"/>

</svg>
