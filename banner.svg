<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    HANDCRAFTED SVG RE README HERO 
    Theme: Space Explorer / Engineering OS
    Colors: #D946EF (Magenta), #38BDF8 (Blue), #22D3EE (Cyan)
  -->
  
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&amp;family=Fira+Code:wght@500&amp;display=swap');
      .name-text { font-family: 'Inter', sans-serif; font-weight: 800; }
      .mono-text { font-family: 'Fira Code', monospace; font-weight: 500; letter-spacing: 2px; }
      
      @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes shimmer { 0% { stop-opacity: 0.2; } 50% { stop-opacity: 0.6; } 100% { stop-opacity: 0.2; } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      
      .star { animation: twinkle 3s infinite ease-in-out; }
      .floating { animation: float 4s infinite ease-in-out; }
      .cursor { animation: blink 0.8s infinite; }
    </style>

    <!-- Gradients -->
    <linearGradient id="bg_grad" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050510"/>
      <stop offset="0.5" stop-color="#09061F"/>
      <stop offset="1" stop-color="#120B32"/>
    </linearGradient>

    <radialGradient id="nebula_purple" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 160) rotate(45) scale(400)">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="name_grad" x1="400" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D946EF"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Glow Effects -->
    <filter id="neon_glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Typing Mask -->
    <mask id="typing_mask">
      <rect x="0" y="0" width="0" height="320" fill="white">
        <animate attributeName="width" from="0" to="1280" dur="2.5s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </mask>
  </defs>

  <!-- BACKGROUND ARCHITECTURE -->
  <rect width="1280" height="320" fill="url(#bg_grad)"/>
  <rect width="1280" height="320" fill="url(#nebula_purple)"/>
  
  <!-- STARS & TWINKLE -->
  <g class="star">
    <circle cx="150" cy="50" r="1" fill="white" opacity="0.6"/>
    <circle cx="450" cy="280" r="1.2" fill="white" opacity="0.8"/>
    <circle cx="900" cy="40" r="0.8" fill="white" opacity="0.4"/>
    <circle cx="1100" cy="250" r="1" fill="#38BDF8" opacity="0.6"/>
    <circle cx="200" cy="200" r="0.5" fill="white" opacity="0.3"/>
  </g>
  
  <!-- SHOOTING STAR -->
  <path d="M-50 50 L50 20" stroke="url(#name_grad)" stroke-width="1" opacity="0">
    <animate attributeName="d" from="M100 -50 L50 0" to="M1300 250 L1250 300" dur="6s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite" begin="2s"/>
  </path>

  <!-- HUD BORDER DECORATIONS -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.4" filter="url(#neon_glow)">
    <!-- Top-Left Bracket -->
    <path d="M20 60 V20 H60 L70 30"/>
    <!-- Bottom-Right Bracket -->
    <path d="M1260 260 V300 H1220 L1210 290"/>
    <!-- Telemetry Lines -->
    <line x1="600" y1="15" x2="680" y2="15" stroke-dasharray="2 4"/>
    <text x="615" y="10" font-family="monospace" font-size="6" fill="#38BDF8" opacity="0.8">COORD: 42.0.1 // SCALE: AUTO</text>
  </g>

  <!-- LEFT: ASTRONAUT ON MOON -->
  <g transform="translate(80, 140)">
    <!-- Moon Surface -->
    <path d="M-100 120 Q120 50 340 120" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <circle cx="150" cy="110" r="15" fill="#1E293B" opacity="0.5"/>
    <circle cx="280" cy="95" r="8" fill="#1E293B" opacity="0.3"/>
    
    <!-- Astronaut Stylized -->
    <g class="floating">
      <!-- Body -->
      <rect x="110" y="45" width="40" height="50" rx="10" fill="#F8FAFC" />
      <rect x="115" y="55" width="30" height="20" rx="5" fill="#0F172A"/> <!-- Visor -->
      <rect x="118" y="58" width="24" height="14" rx="3" fill="url(#name_grad)" opacity="0.8"/> <!-- Visor Glow -->
      <!-- Laptop -->
      <path d="M150 85 L185 85 L195 65 L160 65 Z" fill="#334155"/>
      <rect x="162" y="68" width="28" height="15" fill="#38BDF8" opacity="0.4">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- Tiny Planet -->
    <circle cx="50" cy="20" r="12" fill="#1E1B4B" stroke="#D946EF" stroke-width="0.5" class="floating"/>
    <ellipse cx="50" cy="20" rx="20" ry="4" stroke="#D946EF" stroke-width="0.5" fill="none" opacity="0.4" transform="rotate(-15 50 20)"/>
  </g>

  <!-- CENTER: IDENTITY -->
  <g transform="translate(640, 160)" text-anchor="middle">
    <!-- Masked Typing Text -->
    <g mask="url(#typing_mask)">
      <text y="0" class="name-text" font-size="52" fill="url(#name_grad)" filter="url(#neon_glow)">ADHYATMA SINGH CHAUHAN</text>
    </g>
    
    <!-- Blinking Cursor -->
    <rect width="4" height="40" fill="#22D3EE" class="cursor" y="-35">
      <animateTransform attributeName="transform" type="translate" values="0,0; 450,0" dur="2.5s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>

    <!-- Tagline -->
    <g opacity="0">
      <text y="45" class="mono-text" font-size="14">
        <tspan fill="#D946EF">BUILDING TODAY</tspan>
        <tspan fill="#38BDF8"> • </tspan>
        <tspan fill="#38BDF8">SOLVING TOMORROW</tspan>
        <tspan fill="#22D3EE"> • </tspan>
        <tspan fill="#22D3EE">IMPACTING FOREVER</tspan>
      </text>
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="3s" fill="freeze"/>
      <animate attributeName="transform" type="translate" from="0,20" to="0,0" dur="1s" begin="3s" fill="freeze"/>
    </g>
  </g>

  <!-- RIGHT: MAGNIFICENT RINGED PLANET -->
  <g transform="translate(1080, 160)">
    <!-- Halo -->
    <circle r="75" fill="#38BDF8" opacity="0.05" filter="url(#neon_glow)">
      <animate attributeName="r" values="75;80;75" dur="5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Planet Body -->
    <circle r="60" fill="#0F172A"/>
    <circle r="60" fill="url(#bg_grad)" opacity="0.8"/>
    <path d="M-60 0 A60 60 0 0 1 60 0" fill="#7C3AED" opacity="0.1">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </path>

    <!-- Orbital Rings -->
    <g transform="rotate(-25)">
      <!-- Back Rings -->
      <ellipse cx="0" cy="0" rx="130" ry="25" stroke="#7C3AED" stroke-width="2" fill="none" opacity="0.3" stroke-dasharray="100 50"/>
      <!-- Front Rings -->
      <ellipse cx="0" cy="0" rx="110" ry="20" stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.5"/>
      <ellipse cx="0" cy="0" rx="90" ry="15" stroke="#22D3EE" stroke-width="1" fill="none" opacity="0.4"/>
      
      <animateTransform attributeName="transform" type="scale" values="1;1.02;1" dur="4s" repeatCount="indefinite" additive="sum"/>
    </g>
  </g>

  <!-- FINISHING TECH DETAILS -->
  <g font-family="monospace" font-size="7" fill="#38BDF8" opacity="0.2">
    <text x="1180" y="305">0x74 0x65 0x63 0x68</text>
    <path d="M1170 300 H1260" stroke="#38BDF8" stroke-width="0.5"/>
    <text x="30" y="305">STABLE_CONNECTION // 99.9%</text>
  </g>
</svg>
